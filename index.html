<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10251d"><title>Golf 1 É a Banda</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#182a20;color:white;font-family:system-ui;touch-action:none}canvas{width:100%;height:100%;display:block}.hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}.panel{background:#102019e8;border:1px solid #ffffff35;border-radius:14px;padding:10px 13px}.brand b{color:#f3c45e;display:block}.brand small{color:#bdcabe;font-size:10px}.stats{font-size:12px}.stats strong{color:#f3c45e}.mission{position:fixed;left:12px;bottom:14px;background:#102019e8;border-radius:13px;padding:11px;max-width:220px;font-size:12px}.mission b{color:#f3c45e}.controls{position:fixed;right:15px;bottom:18px;display:flex;gap:9px}.controls button{width:62px;height:62px;border-radius:50%;border:1px solid #ffffff70;background:#102019e8;color:white;font-weight:bold}.controls #act{background:#bd842e;color:#17130a}.joy{position:fixed;left:16px;bottom:24px;width:108px;height:108px;border-radius:50%;border:1px solid #ffffff70;background:#10201988}.stick{position:absolute;left:32px;top:32px;width:42px;height:42px;border-radius:50%;background:#f3c45ecc;border:2px solid white}.toast{position:fixed;top:85px;left:50%;transform:translateX(-50%);background:#102019ed;border:1px solid #f3c45e;border-radius:12px;padding:10px 14px;opacity:0;pointer-events:none;font-size:13px}.toast.show{opacity:1}@media(min-width:850px){.joy{left:25px;bottom:28px}.controls{right:28px;bottom:28px}}@media(max-width:430px){.controls button{width:54px;height:54px}.mission{max-width:175px;font-size:11px}.joy{width:96px;height:96px;left:12px;bottom:20px}.stick{left:27px;top:27px}}
</style></head><body><canvas id="c"></canvas><div class="hud"><div class="panel brand"><b>GOLF 1 É A BANDA</b><small>LUANDA • VIDA NA CIDADE</small></div><div class="panel stats">CARTEIRA<br><strong id="cash">2.500 Kz</strong><br>RESPEITO <strong id="rep">0</strong></div></div><div class="mission"><b>PRIMEIRO DIA NA BANDA</b><br><span id="mission">Explora o bairro e visita o Mercado.</span></div><div class="joy" id="joy"><div class="stick" id="stick"></div></div><div class="controls"><button id="run">CORRER</button><button id="act">AÇÃO</button></div><div class="toast" id="toast"></div>
<script>
(()=>{const c=document.getElementById('c'),g=c.getContext('2d');let w,h,d=1;function size(){d=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*d;c.height=h*d;g.setTransform(d,0,0,d,0,0)}onresize=size;size();
const world={w:1700,h:1300},p={x:520,y:510},cam={x:0,y:0};let joy={x:0,y:0},keys={},fast=false,cash=2500,rep=0,seen=new Set();
const spots=[{x:180,y:170,w:210,h:145,n:'MERCADO DO BAIRRO',c:'#b77b43',id:'mercado'},{x:760,y:160,w:220,h:145,n:'OFICINA DO ZÉ',c:'#607b67',id:'oficina'},{x:1260,y:180,w:220,h:145,n:'PRAÇA DA BANDA',c:'#b79b50',id:'praca'},{x:180,y:850,w:230,h:150,n:'CANTINA DA TIA',c:'#995b46',id:'cantina'},{x:830,y:890,w:230,h:150,n:'ESQUADRA',c:'#526d91',id:'esquadra'},{x:1320,y:850,w:240,h:150,n:'CAMPO DA BANDA',c:'#477d55',id:'campo'}];
function rect(x,y,a,b,r,col){g.fillStyle=col;g.beginPath();g.roundRect(x,y,a,b,r);g.fill()}
function draw(){g.clearRect(0,0,w,h);g.fillStyle='#9b9b75';g.fillRect(0,0,w,h);g.save();g.translate(-cam.x,-cam.y);g.fillStyle='#555b57';g.fillRect(0,410,world.w,170);g.fillRect(570,0,155,world.h);g.fillRect(1170,0,145,world.h);g.fillRect(0,690,world.w,120);g.strokeStyle='#e1d2a2';g.setLineDash([22,20]);g.lineWidth=3;g.beginPath();g.moveTo(0,495);g.lineTo(world.w,495);g.moveTo(648,0);g.lineTo(648,world.h);g.stroke();g.setLineDash([]);
for(let x=25;x<world.w;x+=205)for(let y=25;y<world.h;y+=185){if((x>540&&x<750)||(y>390&&y<590)||(y>670&&y<820))continue;let colors=['#c98765','#d6b879','#9fba91','#b9a0c2','#d0d0ad'];rect(x,y,125,94,5,colors[(x/205+y/185|0)%5]);g.fillStyle='#554536';g.fillRect(x+16,y+18,28,24);g.fillRect(x+78,y+18,28,24);g.fillStyle='#72513b';g.fillRect(x+51,y+56,24,38)}
for(let i=0;i<14;i++){let x=(i*177+90)%world.w,y=(i*239+80)%world.h;g.fillStyle='#725239';g.fillRect(x-3,y,6,27);g.fillStyle='#2e693c';for(let a=0;a<6;a++){g.beginPath();g.ellipse(x+Math.cos(a)*15,y+Math.sin(a)*8,17,6,a*.5,0,7);g.fill()}}
spots.forEach(s=>{rect(s.x-cam.x+7,s.y-cam.y+10,s.w,s.h,8,'#0005');rect(s.x,s.y,s.w,s.h,8,s.c);g.fillStyle='#fff5';g.fillRect(s.x+8,s.y+8,s.w-16,10);g.fillStyle='#efdbb3';g.fillRect(s.x+s.w/2-20,s.y+s.h-45,40,45);g.fillStyle='#17251f';g.font='bold 12px system-ui';g.textAlign='center';g.fillText(s.n,s.x+s.w/2,s.y-9)});
rect(790,454,105,42,8,'#d8d1bc');rect(800,460,82,28,5,'#2871a1');g.fillStyle='#f6efd9';g.fillRect(810,463,23,13);g.fillRect(840,463,23,13);g.fillStyle='#222';g.beginPath();g.arc(812,499,8,0,7);g.arc(875,499,8,0,7);g.fill();g.restore();
let x=w/2,y=h/2;g.fillStyle='#0006';g.beginPath();g.ellipse(x,y+14,13,6,0,0,7);g.fill();g.fillStyle='#e8b88c';g.beginPath();g.arc(x,y-7,9,0,7);g.fill();g.fillStyle='#19372a';g.fillRect(x-9,y+2,18,20);g.fillStyle='#e6bd62';g.fillRect(x-9,y+2,18,5);g.fillStyle='white';g.font='bold 11px system-ui';g.textAlign='center';g.fillText('TU',x,y-23);g.textAlign='left'}
function near(){return spots.find(s=>Math.hypot(p.x-s.x-s.w/2,p.y-s.y-s.h/2)<135)}
let toast=document.getElementById('toast');function say(t){toast.textContent=t;toast.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>toast.classList.remove('show'),2200)}
function action(){let s=near();if(!s){say('Aproxima-te de um estabelecimento para interagir.');return}if(!seen.has(s.id)){seen.add(s.id);rep+=5;if(s.id==='mercado')cash+=250;document.getElementById('rep').textContent=rep;document.getElementById('cash').textContent=cash.toLocaleString('pt-PT')+' Kz';document.getElementById('mission').textContent=seen.size===spots.length?'Conheceste os principais locais! A tua história começa agora.':'Continua a explorar e visita os outros locais.';say('Visitaste '+s.n+' • +5 respeito')}else say('Bem-vindo a '+s.n+'.')}
let last=0;function loop(t){let dt=Math.min((t-last)/1000||0,.04);last=t;let x=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0)+joy.x,y=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0)+joy.y,l=Math.hypot(x,y);if(l>1){x/=l;y/=l}let v=(fast?225:135)*dt;p.x=Math.max(20,Math.min(world.w-20,p.x+x*v));p.y=Math.max(20,Math.min(world.h-20,p.y+y*v));cam.x=Math.max(0,Math.min(world.w-w,p.x-w/2));cam.y=Math.max(0,Math.min(world.h-h,p.y-h/2));draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
onkeydown=e=>{keys[e.key]=true;if(e.key===' '||e.key==='Enter')action();if(e.key==='Shift')fast=true};onkeyup=e=>{keys[e.key]=false;if(e.key==='Shift')fast=false};let run=document.getElementById('run');run.onpointerdown=()=>fast=true;['pointerup','pointerleave','pointercancel'].forEach(e=>run.addEventListener(e,()=>fast=false));document.getElementById('act').onclick=action;
let j=document.getElementById('joy'),st=document.getElementById('stick'),pid=null;j.onpointerdown=e=>{pid=e.pointerId;j.setPointerCapture(pid);move(e)};j.onpointermove=e=>{if(e.pointerId===pid)move(e)};function move(e){let r=j.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,m=Math.hypot(x,y),lim=33;if(m>lim){x=x/m*lim;y=y/m*lim}joy.x=x/lim;joy.y=y/lim;st.style.transform='translate('+x+'px,'+y+'px)'}function end(){pid=null;joy={x:0,y:0};st.style.transform=''}['pointerup','pointercancel','lostpointercapture'].forEach(e=>j.addEventListener(e,end));
})();
</script></body></html>
