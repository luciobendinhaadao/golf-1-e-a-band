<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">

<title>GOLF 1 É A BANDA — Subzona 5</title>
<style>
:root{--gold:#f4c65e;--dark:#102019;--panel:#102019ee}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#283b2d;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{width:100%;height:100%;display:block}
.hud{position:fixed;top:max(9px,env(safe-area-inset-top));left:10px;right:10px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;pointer-events:none}.brand,.stats,.fuel{background:var(--panel);border:1px solid #ffffff35;border-radius:13px;padding:9px 11px;box-shadow:0 5px 16px #0004}.brand b{display:block;color:var(--gold);font-size:13px;letter-spacing:.5px}.brand small{display:block;color:#d0ddcf;font-size:10px;margin-top:3px}.stats{text-align:right;font-size:11px;line-height:1.55}.stats strong{color:var(--gold)}.fuel{position:fixed;top:82px;right:10px;width:132px;font-size:10px;display:none}.fuel.show{display:block}.bar{height:7px;background:#435248;border-radius:9px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;width:100%;background:#72c66c;border-radius:9px}.mission{position:fixed;left:10px;bottom:max(12px,env(safe-area-inset-bottom));max-width:210px;background:var(--panel);border:1px solid #ffffff25;border-radius:12px;padding:9px 11px;font-size:11px;line-height:1.35;pointer-events:none}.mission b{color:var(--gold);display:block;margin-bottom:3px}.controls{position:fixed;right:13px;bottom:max(17px,env(safe-area-inset-bottom));display:flex;gap:9px;align-items:flex-end}.controls button{width:59px;height:59px;border-radius:50%;border:1px solid #ffffff80;background:#102019eF;color:#fff;font-weight:800;font-size:10px;box-shadow:0 4px 12px #0006;touch-action:none}.controls #act{background:#b77d2c;color:#17130a;width:65px;height:65px}.joy{position:fixed;left:14px;bottom:max(20px,env(safe-area-inset-bottom));width:106px;height:106px;border-radius:50%;border:1px solid #ffffff70;background:#10201988;box-shadow:inset 0 0 16px #0004;touch-action:none}.stick{position:absolute;left:32px;top:32px;width:42px;height:42px;border-radius:50%;background:#f3c45ecc;border:2px solid #fff;box-shadow:0 3px 9px #0006;pointer-events:none}.toast{position:fixed;top:135px;left:50%;transform:translateX(-50%);background:#102019f2;border:1px solid var(--gold);border-radius:12px;padding:10px 14px;max-width:85vw;text-align:center;font-size:12px;opacity:0;transition:opacity .18s;pointer-events:none}.toast.show{opacity:1}
.dialog{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(360px,calc(100vw - 34px));background:#14251c;border:1px solid #e5bb55;border-radius:18px;padding:17px;box-shadow:0 16px 50px #000b;display:none;z-index:5}.dialog.show{display:block}.dialog h2{font-size:17px;color:var(--gold);margin:0 30px 7px 0}.dialog p{font-size:13px;line-height:1.5;color:#e4eadf;margin:8px 0 13px}.dialog .tag{font-size:10px;color:#f5d47e;letter-spacing:1px}.dialog button{border:0;border-radius:10px;padding:10px 13px;background:#c18b37;color:#17130a;font-weight:800;margin:3px 5px 0 0}.dialog button.secondary{background:#34483b;color:#fff}.close{position:absolute;right:12px;top:10px;background:#34483b!important;color:#fff!important;padding:5px 10px!important}.workbox{position:fixed;left:50%;top:43%;transform:translate(-50%,-50%);width:min(260px,80vw);display:none;background:#102019ed;border:1px solid var(--gold);border-radius:13px;padding:12px;text-align:center;font-size:12px;z-index:4}.workbox.show{display:block}.workbox .bar{height:10px}.workbox .bar i{background:var(--gold);width:0}.hint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:10px;color:#fff;background:#0008;padding:5px 9px;border-radius:8px;pointer-events:none}
@media(max-width:430px){.brand b{font-size:11px}.brand small{font-size:9px}.stats{font-size:10px;padding:8px}.controls button{width:52px;height:52px}.controls #act{width:59px;height:59px}.joy{width:96px;height:96px}.stick{left:27px;top:27px}.mission{max-width:158px;font-size:10px}.fuel{top:76px;width:112px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
 <div class="brand"><b>GOLF 1 É A BANDA</b><small>SUBZONA 5 • LUANDA</small></div>
 <div class="stats">CARTEIRA<br><strong id="cash">2.500 Kz</strong><br>RESPEITO <strong id="rep">0</strong></div>
</div>
<div class="fuel" id="fuelBox">GASOLINA <b id="fuelText">100%</b><div class="bar"><i id="fuelFill"></i></div></div>
<div class="mission"><b>MISSÃO • CHEGADA À BANDA</b><span id="missionText">Conhece a Subzona 5, fala com os cotas e descobre o Prédio Amarelo.</span></div>
<div class="joy" id="joy"><div class="stick" id="stick"></div></div>
<div class="controls"><button id="run">CORRER</button><button id="act">AÇÃO</button></div>
<div class="toast" id="toast"></div>
<div class="dialog" id="dialog"><button class="close" id="closeDialog">✕</button><div class="tag" id="dialogTag">SUBZONA 5</div><h2 id="dialogName">Personagem</h2><p id="dialogText"></p><div id="dialogActions"><button id="dialogReward">ACEITAR</button><button class="secondary" id="dialogClose2">FECHAR</button></div></div>
<div class="workbox" id="workbox">TURNO DE TRABALHO <b id="workPct">0%</b><div class="bar"><i id="workFill"></i></div><small>Espera 3 segundos para receber.</small></div>
<script>
(()=> {
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W=innerWidth,H=innerHeight,D=1;function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
const world={w:2400,h:1900},player={x:1190,y:940},camera={x:0,y:0};
let interior=null,interiorReturn={x:1190,y:940},cash=2500,rep=0,gas=100,driving=false,car={x:1305,y:1050,angle:0,speed:0},joy={x:0,y:0},keys={},running=false,last=0,dialogNPC=null,working=null,visited=new Set(),talked=new Set(),audioCtx=null;
const $=id=>document.getElementById(id);
const roads=[{x:0,y:850,w:2400,h:180},{x:1080,y:0,w:190,h:1900},{x:0,y:390,w:2400,h:135},{x:420,y:0,w:150,h:1900},{x:1770,y:0,w:150,h:1900},{x:0,y:1430,w:2400,h:135}];
const buildings=[
{x:110,y:115,w:230,h:180,n:'MERCADO DA SUBZONA 5',c:'#b87843',type:'market'},
{x:390,y:115,w:230,h:180,n:'OFICINA DO MAN FURRA',c:'#617b67',type:'workshop'},
{x:680,y:115,w:230,h:180,n:'ALFAIATARIA DO TIO GONÇALVES',c:'#a36b83',type:'tailor'},
{x:970,y:115,w:230,h:180,n:'QUARTEL MILITAR',c:'#65754c',type:'barracks'},
{x:1270,y:115,w:230,h:180,n:'ESCOLA DA BANDA',c:'#b79b50',type:'school'},
{x:1570,y:115,w:230,h:180,n:'EMPRESAS E ESCRITÓRIOS',c:'#627b91',type:'office'},
{x:1870,y:115,w:230,h:180,n:'CANTINA DA TIA',c:'#9b6047',type:'cantina'},
{x:130,y:1190,w:235,h:180,n:'ESQUADRA',c:'#526d91',type:'police'},
{x:430,y:1190,w:235,h:180,n:'HOSPITAL DA BANDA',c:'#d5e0dc',type:'hospital'},
{x:730,y:1510,w:250,h:175,n:'CAMPO DA BANDA',c:'#477d55',type:'field'},
{x:1070,y:1190,w:250,h:190,n:'CASAS PARA ALUGAR',c:'#b58c63',type:'homes'},
{x:1420,y:1190,w:280,h:195,n:'PRÉDIO AMARELO',c:'#f0c83f',type:'yellow'},
{x:1810,y:1190,w:250,h:190,n:'APARTAMENTOS DA BANDA',c:'#a58d70',type:'apartments'},
{x:2020,y:570,w:230,h:180,n:'PRAÇA E CONVÍVIO',c:'#b79b50',type:'plaza'}
];
const npcs=[
{name:'Man Furra',x:1490,y:480,role:'COTA DA PRAÇA',line:'A banda é de todos, kota. Respeita os mais velhos e faz o teu caminho com cabeça.',reward:450,rep:8,color:'#b94e38'},
{name:'Tio Cabelo',x:1660,y:510,role:'COTA DA PRAÇA',line:'Aqui a palavra vale. Dá uma volta pela Subzona e mostra que conheces a tua banda.',reward:500,rep:9,color:'#4e7795'},
{name:'Ti Menezes',x:820,y:600,role:'CONSELHEIRO',line:'Dinheiro bem cuidado cresce. Primeiro aprende a trabalhar, depois pensa em investir.',reward:650,rep:10,color:'#8d6caa'},
{name:'Cota Dino',x:970,y:610,role:'CONSELHEIRO',line:'Não gastes tudo no primeiro dia. Guarda uma parte e investe no que conheces.',reward:600,rep:10,color:'#497b55'},
{name:'Tio Gonçalvez',x:2080,y:430,role:'COMERCIANTE',line:'Negócio bom começa com confiança. Junta Kwanzas e um dia poderás ter o teu espaço.',reward:700,rep:11,color:'#b88b42'},
{name:'Piso na Lei',x:1300,y:1320,role:'ORDEM DA BANDA',line:'Mantém o respeito nas ruas. Corridas limpas e sem confusão dão nome à Subzona.',reward:550,rep:10,color:'#52627e'},
{name:'Patrocínio',x:2020,y:610,role:'COMÉRCIO E FINANÇAS',line:'Trabalha, junta capital e volta a falar comigo. Há oportunidades para quem se prepara.',reward:700,rep:12,color:'#a65b50'},
{name:'Mancena',x:1490,y:1320,role:'ORDEM DA BANDA',line:'A rua tem regras, kota. Conhece os caminhos e não te metas em problemas.',reward:500,rep:9,color:'#477c7b'}
];
const monarch=['Will Fox','Ezequiel','Cassopy','Elvis','Lúcio','Belmiro','Paito','Mendes','Esmael'];
monarch.forEach((n,i)=>npcs.push({name:n,x:1110+(i%3)*105,y:1050+Math.floor(i/3)*75,role:'MONARQUIA 120',line:'Monarquia 120 presente na Subzona 5! Mantém a união, o respeito e a energia da banda.',reward:300,rep:6,color:['#b68a35','#4f718d','#8d5c9c'][i%3],tag:'[M120]'}));
const workplaceMap={'Man Furra':'workshop','Tio Gonçalvez':'tailor','Tio Cabelo':'barracks','Ti Menezes':'police','Cota Dino':'office','Piso na Lei':'police','Patrocínio':'market','Mancena':'plaza','Will Fox':'yellow','Ezequiel':'office','Cassopy':'workshop','Elvis':'school','Lúcio':'yellow','Belmiro':'cantina','Paito':'plaza','Mendes':'office','Esmael':'school'};npcs.forEach(n=>{n.workplace=workplaceMap[n.name]||null;n.rx=110+(n.name.length*17)%250;n.ry=110+(n.name.length*23)%135});
const trees=[];for(let x=60;x<world.w;x+=190)for(let y=60;y<world.h;y+=185){if(roads.some(r=>x>r.x-35&&x<r.x+r.w+35&&y>r.y-35&&y<r.y+r.h+35))continue;if(buildings.some(b=>x>b.x-35&&x<b.x+b.w+35&&y>b.y-35&&y<b.y+b.h+35))continue;trees.push({x,y})}
function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function drawRoads(){ctx.fillStyle='#777b72';ctx.fillRect(0,0,world.w,world.h);
roads.forEach((r,i)=>{ctx.fillStyle='#3e4544';ctx.fillRect(r.x,r.y,r.w,r.h);ctx.fillStyle='#b5b2a1';if(r.w>r.h){ctx.fillRect(r.x,r.y-13,r.w,8);ctx.fillRect(r.x,r.y+r.h+5,r.w,8);ctx.strokeStyle='#e4d6a5';ctx.setLineDash([26,22]);ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(r.x,r.y+r.h/2);ctx.lineTo(r.x+r.w,r.y+r.h/2);ctx.stroke();ctx.setLineDash([])}else{ctx.fillRect(r.x-13,r.y,8,r.h);ctx.fillRect(r.x+r.w+5,r.y,8,r.h);ctx.strokeStyle='#e4d6a5';ctx.setLineDash([26,22]);ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(r.x+r.w/2,r.y);ctx.lineTo(r.x+r.w/2,r.y+r.h);ctx.stroke();ctx.setLineDash([])}});
ctx.fillStyle='#e8e2c9';roads.filter(r=>r.w>r.h).forEach(r=>{for(let x=280;x<world.w;x+=500)for(let k=0;k<6;k++)ctx.fillRect(x+k*9,r.y+10,5,28)});roads.filter(r=>r.h>r.w).forEach(r=>{for(let y=240;y<world.h;y+=470)for(let k=0;k<6;k++)ctx.fillRect(r.x+10,y+k*9,28,5)});
}
function drawBuilding(b){ctx.save();ctx.shadowColor='#1119';ctx.shadowBlur=12;ctx.shadowOffsetY=8;rounded(b.x,b.y,b.w,b.h,7,'#0005');ctx.shadowColor='transparent';rounded(b.x,b.y,b.w,b.h,7,b.c);ctx.fillStyle='#ffffff32';ctx.fillRect(b.x+8,b.y+8,b.w-16,12);
if(b.type==='yellow'){ctx.fillStyle='#d6a927';ctx.fillRect(b.x+15,b.y+30,b.w-30,b.h-45);for(let row=0;row<3;row++)for(let col=0;col<5;col++){ctx.fillStyle='#9bd0d1';ctx.fillRect(b.x+28+col*48,b.y+48+row*39,25,19);ctx.fillStyle='#f8e8a6';ctx.fillRect(b.x+26+col*48,b.y+68+row*39,29,4)}ctx.fillStyle='#80532c';ctx.fillRect(b.x+b.w/2-24,b.y+b.h-53,48,53);ctx.fillStyle='#f6df8a';ctx.fillRect(b.x+15,b.y+24,b.w-30,7);ctx.fillStyle='#fff';ctx.font='bold 15px system-ui';ctx.textAlign='center';ctx.fillText('PRÉDIO AMARELO',b.x+b.w/2,b.y-13)}
else{ctx.fillStyle='#523e32';ctx.fillRect(b.x+25,b.y+38,38,35);ctx.fillRect(b.x+b.w-65,b.y+38,38,35);ctx.fillStyle='#e8d7b8';ctx.fillRect(b.x+b.w/2-17,b.y+b.h-43,34,43);ctx.fillStyle='#ffffff';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText(b.n,b.x+b.w/2,b.y-10)}
ctx.restore()}
function drawTree(t){ctx.fillStyle='#694a30';ctx.fillRect(t.x-4,t.y,8,24);ctx.fillStyle='#28633b';for(let a=0;a<6;a++){ctx.beginPath();ctx.ellipse(t.x+Math.cos(a)*12,t.y-4+Math.sin(a)*8,15,7,a*.5,0,Math.PI*2);ctx.fill()}}
function drawLamp(x,y){ctx.fillStyle='#343b37';ctx.fillRect(x-2,y,4,28);ctx.fillStyle='#e8d18a';ctx.beginPath();ctx.arc(x,y,5,0,7);ctx.fill()}
function drawSigns(){const signs=[{x:485,y:365,t:'RUA DA SUBZONA 5'},{x:1370,y:1150,t:'AV. DO PRÉDIO AMARELO'},{x:750,y:810,t:'BECO DA OFICINA'},{x:1830,y:815,t:'RUA DA PRAÇA'}];signs.forEach(s=>{rounded(s.x-4,s.y-23,9,33,2,'#4b3b2b');rounded(s.x-70,s.y-42,145,25,5,'#315b46');ctx.strokeStyle='#e6d18a';ctx.strokeRect(s.x-70,s.y-42,145,25);ctx.fillStyle='white';ctx.font='bold 9px system-ui';ctx.textAlign='center';ctx.fillText(s.t,s.x+2,s.y-25)});[ [400,350],[1030,340],[1720,350],[400,810],[1730,810],[1030,1390],[1720,1390] ].forEach(([x,y])=>drawLamp(x,y))}
function drawPerson(n,highlight){ctx.save();ctx.translate(n.x,n.y);ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(0,14,12,5,0,0,7);ctx.fill();ctx.fillStyle=n.color;ctx.fillRect(-9,-1,18,22);ctx.fillStyle='#e0ad83';ctx.beginPath();ctx.arc(0,-9,8,0,7);ctx.fill();ctx.fillStyle='#24221f';ctx.fillRect(-7,-17,14,5);if(n.tag){ctx.font='bold 9px system-ui';ctx.textAlign='center';ctx.fillStyle='#f6ce59';ctx.fillText(n.tag,0,-31)}ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='#17231b';ctx.strokeText(n.name,0,-22);ctx.fillStyle='#fff';ctx.fillText(n.name,0,-22);if(highlight){ctx.strokeStyle='#f4c65e';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,19,0,7);ctx.stroke()}ctx.restore()}
function drawCar(x,y,angle,scale=1){ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.scale(scale,scale);ctx.fillStyle='#161a18';ctx.fillRect(-30,-18,14,7);ctx.fillRect(16,-18,14,7);ctx.fillRect(-30,12,14,7);ctx.fillRect(16,12,14,7);rounded(-31,-15,62,30,7,'#ded6bd');rounded(-26,-12,52,24,5,'#246a9a');ctx.fillStyle='#b9dce0';ctx.fillRect(-16,-10,12,9);ctx.fillRect(4,-10,12,9);ctx.fillStyle='#f6edc8';ctx.fillRect(27,-10,5,7);ctx.fillRect(27,4,5,7);ctx.fillStyle='#d1d4d1';ctx.fillRect(-31,-5,4,10);ctx.fillStyle='#f8edbf';ctx.fillRect(29,-10,7,5);ctx.fillRect(29,5,7,5);ctx.restore()}
function nearestNPC(){let best=null,dist=76;npcs.filter(n=>interior?n.workplace===interior.type:!n.workplace).forEach(n=>{let px=interior?n.rx:n.x,py=interior?n.ry:n.y,d=Math.hypot(player.x-px,player.y-py);if(d<dist){dist=d;best=n}});return best}
function nearestBuilding(){let best=null,dist=92;buildings.forEach(b=>{let d=Math.hypot(player.x-(b.x+b.w/2),player.y-(b.y+b.h+22));if(d<dist){dist=d;best=b}});return best}
function blocked(x,y,r){for(const b of buildings){const doorX=b.x+b.w/2,atDoor=Math.abs(x-doorX)<31&&y>b.y+b.h-12&&y<b.y+b.h+38;if(!atDoor&&x+r>b.x&&x-r<b.x+b.w&&y+r>b.y&&y-r<b.y+b.h)return true}return false}
function drawPlayer(px,py){ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(px,py+14,12,5,0,0,7);ctx.fill();ctx.fillStyle='#e5b58d';ctx.beginPath();ctx.arc(px,py-8,8,0,7);ctx.fill();ctx.fillStyle='#244b36';ctx.fillRect(px-9,py,18,20);ctx.fillStyle='#f3c45e';ctx.fillRect(px-9,py,18,4)}
function drawInterior(){ctx.fillStyle='#202923';ctx.fillRect(0,0,W,H);const pad=24,top=70,bw=W-pad*2,bh=H-top-45;rounded(pad,top,bw,bh,12,'#9a8060');rounded(pad+12,top+12,bw-24,bh-24,7,'#d4c3a3');ctx.fillStyle='#6c5843';ctx.fillRect(pad+12,top+12,bw-24,15);ctx.fillRect(pad+12,top+12,15,bh-24);ctx.fillRect(pad+bw-27,top+12,15,bh-24);ctx.fillRect(pad+12,top+bh-27,bw-24,15);ctx.fillStyle='#3d3026';ctx.fillRect(W/2-32,top+bh-17,64,26);ctx.fillStyle='#fff';ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillText(interior.n,W/2,42);ctx.font='11px system-ui';ctx.fillText('INTERIOR • AÇÃO junto à porta para sair',W/2,H-13);
const furn=[['market','BALCÃO',pad+45,top+55,110,36],['workshop','BANCADA DE FERRAMENTAS',pad+35,top+55,150,48],['tailor','MÁQUINA DE COSTURA',pad+35,top+55,120,45],['barracks','MESA DE COMANDO',pad+45,top+55,140,48],['police','BALCÃO DE ATENDIMENTO',pad+35,top+55,150,45],['hospital','RECEPÇÃO / MACA',pad+35,top+55,150,45],['school','QUADRO E CARTEIRAS',pad+35,top+55,150,45],['office','SECRETÁRIAS / MESAS',pad+35,top+55,150,45],['cantina','BALCÃO DA CANTINA',pad+35,top+55,145,45],['yellow','HALL DO PRÉDIO',pad+35,top+55,145,45],['homes','SALA DA CASA',pad+35,top+55,145,45],['apartments','SALA DO APARTAMENTO',pad+35,top+55,145,45],['plaza','BANCOS DE CONVÍVIO',pad+35,top+55,145,45]];let q=furn.find(a=>a[0]===interior.type);if(q){rounded(q[2],q[3],q[4],q[5],5,'#72543c');ctx.fillStyle='#fff';ctx.font='10px system-ui';ctx.fillText(q[1],q[2]+q[4]/2,q[3]+q[5]/2+4)}npcs.filter(n=>n.workplace===interior.type).forEach(n=>drawPerson({...n,x:n.rx+pad,y:n.ry+top},n===nearestNPC()));drawPlayer(player.x+pad,player.y+top);}
function draw(){ctx.clearRect(0,0,W,H);if(interior){drawInterior();return}ctx.save();ctx.translate(-camera.x,-camera.y);drawRoads();trees.forEach(drawTree);buildings.forEach(b=>{drawBuilding(b);ctx.fillStyle='#f5df9a';ctx.fillRect(b.x+b.w/2-18,b.y+b.h-2,36,5)});drawSigns();npcs.filter(n=>!n.workplace).forEach(n=>drawPerson(n,n===nearestNPC()));if(driving){drawCar(car.x,car.y,car.angle)}else drawPlayer(player.x,player.y);ctx.restore()}
function updateHUD(){$('cash').textContent=cash.toLocaleString('pt-PT')+' Kz';$('rep').textContent=rep;$('fuelText').textContent=Math.round(gas)+'%';$('fuelFill').style.width=gas+'%';$('fuelFill').style.background=gas<20?'#d65a45':'#72c66c';$('fuelBox').classList.toggle('show',driving)}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.remove('show'),2300)}
function sound(freq=420,dur=.12){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),gain=audioCtx.createGain();o.type='triangle';o.frequency.value=freq;gain.gain.setValueAtTime(.035,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.connect(gain);gain.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}catch(e){}}
function openDialog(name,tag,line,reward,repGain,cb){dialogNPC={name,tag,line,reward,repGain,cb};$('dialogTag').textContent=tag;$('dialogName').textContent=name;$('dialogText').textContent=line;$('dialogReward').textContent=reward?'RECEBER RECOMPENSA':'OK';$('dialogReward').style.display=reward?'inline-block':'none';$('dialog').classList.add('show')}
function closeDialog(){$('dialog').classList.remove('show');dialogNPC=null}
$('closeDialog').onclick=closeDialog;$('dialogClose2').onclick=closeDialog;
$('dialogReward').onclick=()=>{if(dialogNPC&&dialogNPC.cb)dialogNPC.cb();closeDialog()};
function startWork(place){if(working)return;let start=performance.now(),duration=3000,earn=500+Math.floor(Math.random()*1501);working={start,duration,earn,place};$('workbox').classList.add('show');toast('Turno iniciado: '+place+'. Aguenta 3 segundos!')}
function completeWork(){cash+=working.earn;rep+=5;toast('Turno concluído! +'+working.earn.toLocaleString('pt-PT')+' Kz • +5 respeito');working=null;$('workbox').classList.remove('show');updateHUD();$('missionText').textContent='Já ganhaste dinheiro com o teu trabalho. Continua a explorar a Subzona 5.'}
function action(){if($('dialog').classList.contains('show'))return;
if(interior){if(Math.hypot(player.x-car.x,player.y-car.y)<85){driving=true;car.x=player.x;car.y=player.y;updateHUD();sound(180,.2);toast('Entraste no Golf 1!');return}
const n=nearestNPC();if(n){const key=(n.tag?'m120-':'npc-')+n.name;openDialog(n.name,n.tag||n.role,n.line,talked.has(key)?0:n.reward,talked.has(key)?0:n.rep,()=>{cash+=n.reward;rep+=n.rep;talked.add(key);updateHUD();toast('+'+n.reward+' Kz • +'+n.rep+' respeito')});return}if(player.y>=(H-110)){interior=null;player.x=interiorReturn.x;player.y=interiorReturn.y;toast('Saíste para a Subzona 5.');return}toast('Explora o compartimento e aproxima-te de um personagem.');return}
if(driving){if(Math.hypot(car.x-802,car.y-220)<170){openDialog('Oficina do Zé','SERVIÇO AUTOMÓVEL','Reabastecer custa 400 Kz. Reparar e abastecer custa 700 Kz.',0,0,()=>{});$('dialogReward').textContent='';$('dialogReward').style.display='none';const b=document.createElement('button');b.textContent='ABASTECER • 400 Kz';b.onclick=()=>{if(cash>=400){cash-=400;gas=100;car.speed=0;updateHUD();toast('Depósito cheio!')}else toast('Não tens Kwanzas suficientes.');b.remove();closeDialog()};$('dialogActions').prepend(b);return}driving=false;player.x=car.x+50;player.y=car.y;car.speed=0;updateHUD();toast('Saíste do Golf 1.');return}
const n=nearestNPC();if(n){const key=n.tag?'m120-'+n.name:'npc-'+n.name;if(talked.has(key)){openDialog(n.name,n.tag||n.role,'Já falámos, kota. Continua a tua caminhada pela banda.',0,0,()=>{});$('dialogReward').style.display='none';return}openDialog(n.name,n.tag||n.role,n.line,n.reward,n.rep,()=>{cash+=n.reward;rep+=n.rep;talked.add(key);updateHUD();toast('+'+n.reward+' Kz • +'+n.rep+' respeito');$('missionText').textContent='A tua reputação está a crescer na Subzona 5.'});return}
const b=nearestBuilding();if(!b){toast('Aproxima-te da porta de um estabelecimento ou do Golf 1.');return}
interiorReturn={x:player.x,y:player.y};interior=b;player.x=W/2-24;player.y=H-145;toast('Entraste em '+b.n+'. Explora o interior!');return;
if(b.type==='workshop'){openDialog('Oficina do Zé','OFICINA','Aqui podes trabalhar 3 segundos, reparar o Golf 1 por 500 Kz ou abastecer por 400 Kz.',0,0,()=>{});$('dialogReward').style.display='none';const add=(label,fn)=>{const bt=document.createElement('button');bt.textContent=label;bt.onclick=()=>{fn();closeDialog()};$('dialogActions').prepend(bt)};add('TRABALHAR',()=>startWork('Oficina'));add('REPARAR • 500 Kz',()=>{if(cash>=500){cash-=500;gas=100;car.speed=0;updateHUD();toast('Golf 1 reparado e abastecido!')}else toast('Faltam Kwanzas.')});add('GASOLINA • 400 Kz',()=>{if(cash>=400){cash-=400;gas=100;updateHUD();toast('Depósito cheio!')}else toast('Faltam Kwanzas.')});return}
if(['market','cantina'].includes(b.type)){openDialog(b.n,b.type==='market'?'MERCADO':'CANTINA','Queres fazer um turno rápido de trabalho? Trabalha 3 segundos e recebe entre 500 e 2.000 Kz, mais respeito.',0,0,()=>{});$('dialogReward').style.display='none';const bt=document.createElement('button');bt.textContent='COMEÇAR TURNO';bt.onclick=()=>{closeDialog();startWork(b.n)};$('dialogActions').prepend(bt);return}
openDialog(b.n,'SUBZONA 5','Chegaste a '+b.n+'. Continua a descobrir os pontos importantes da banda.',0,0,()=>{});$('dialogReward').style.display='none'}
function loop(t){const dt=Math.min((t-last)/1000||0,.04);last=t;
let x=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0)+joy.x,y=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0)+joy.y,l=Math.hypot(x,y);if(l>1){x/=l;y/=l}
if(interior){const speed=running?175:115,nx=player.x+x*speed*dt,ny=player.y+y*speed*dt;player.x=Math.max(45,Math.min(W-45,nx));player.y=Math.max(105,Math.min(H-110,ny))}
else if(driving){let steer=((keys.ArrowRight||keys.d)?1:0)-((keys.ArrowLeft||keys.a)?1:0)+joy.x;steer=Math.max(-1,Math.min(1,steer));let throttle=((keys.ArrowUp||keys.w)?1:0)-((keys.ArrowDown||keys.s)?1:0)-joy.y;throttle=Math.max(-1,Math.min(1,throttle));if(Math.abs(throttle)>.01&&gas>0){car.speed+=throttle*210*dt;car.speed=Math.max(-95,Math.min(260,car.speed));gas=Math.max(0,gas-Math.abs(car.speed)*dt*.004)}else car.speed*=.96;if(gas<=0)car.speed=Math.max(-45,Math.min(65,car.speed));car.angle+=steer*dt*(.9+Math.abs(car.speed)/170);let nx=car.x+Math.cos(car.angle)*car.speed*dt,ny=car.y+Math.sin(car.angle)*car.speed*dt;if(!blocked(nx,ny,27)){car.x=Math.max(30,Math.min(world.w-30,nx));car.y=Math.max(30,Math.min(world.h-30,ny))}else car.speed=0;player.x=car.x;player.y=car.y;if(Math.abs(car.speed)>25&&Math.random()<.02)sound(95,.05);camera.x=Math.max(0,Math.min(world.w-W,car.x-W/2));camera.y=Math.max(0,Math.min(world.h-H,car.y-H/2))}
else if(!interior){const speed=running?215:130,nx=player.x+x*speed*dt,ny=player.y+y*speed*dt;if(!blocked(nx,player.y,11))player.x=nx;if(!blocked(player.x,ny,11))player.y=ny;camera.x=Math.max(0,Math.min(world.w-W,player.x-W/2));camera.y=Math.max(0,Math.min(world.h-H,player.y-H/2))}
if(working){let pct=Math.min(100,(t-working.start)/working.duration*100);$('workPct').textContent=Math.floor(pct)+'%';$('workFill').style.width=pct+'%';if(pct>=100)completeWork()}
draw();updateHUD();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '||e.key==='Enter'){e.preventDefault();action()}if(e.key==='Shift')running=true});addEventListener('keyup',e=>{keys[e.key]=false;if(e.key==='Shift')running=false});
const runBtn=$('run');runBtn.onpointerdown=()=>running=true;['pointerup','pointerleave','pointercancel'].forEach(ev=>runBtn.addEventListener(ev,()=>running=false));$('act').onclick=action;
const j=$('joy'),stick=$('stick');let pointer=null;j.onpointerdown=e=>{pointer=e.pointerId;j.setPointerCapture(pointer);moveJoy(e)};j.onpointermove=e=>{if(e.pointerId===pointer)moveJoy(e)};function moveJoy(e){const r=j.getBoundingClientRect();let dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,m=Math.hypot(dx,dy),lim=34;if(m>lim){dx=dx/m*lim;dy=dy/m*lim}joy.x=dx/lim;joy.y=dy/lim;stick.style.transform='translate('+dx+'px,'+dy+'px)'}function endJoy(){pointer=null;joy={x:0,y:0};stick.style.transform=''}['pointerup','pointercancel','lostpointercapture'].forEach(ev=>j.addEventListener(ev,endJoy));
canvas.addEventListener('dblclick',()=>{if(!driving&&!interior&&Math.hypot(player.x-car.x,player.y-car.y)<95){driving=true;car.x=player.x;car.y=player.y;updateHUD();sound(180,.2);toast('Entraste no Golf 1! Usa o joystick para conduzir.')}});
updateHUD();
})();
</script>
